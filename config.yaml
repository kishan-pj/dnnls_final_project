seed: 42

# Paths
paths:
  checkpoint_dir: checkpoints
  results_dir: results/baseline
  text_autoencoder_checkpoint: checkpoints/text_autoencoder.pth

# Dataset
dataset:
  name: daniel3303/StoryReasoning
  train_split: train
  test_split: test
  sequence_length: 4
  max_text_length: 120
  image_height: 60
  image_width: 125
  train_batch_size: 8
  val_batch_size: 4
  test_batch_size: 4
  validation_fraction: 0.2
  num_workers: 0

# Model
model:
  embedding_dim: 16
  latent_dim: 16
  gru_hidden_dim: 16
  num_layers: 1
  dropout: 0.1

# Training
training:
  epochs: 10
  learning_rate: 0.001
  freeze_text_autoencoder: true
  save_every_epoch: false

# Evaluation
evaluation:
  bleu_max_batches: 5

# CoT flags
cot:
  use_frame_aware_grounding: true
  use_contrastive_roi: true
  use_entity_pooling: true
  use_cot_text: false
  contrastive_tau: 0.07

# Loss weights
loss_weights:
  reid: 0.10
  ground_mse: 0.10
  contrastive: 0.10
  entity_pool: 0.05
